<!DOCTYPE html>
<html lang="pt-BR" data-theme="dark">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="theme-color" content="#0f172a">
  <title>Trashbelt — Histórico</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=JetBrains+Mono:wght@500;600;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="../css/style.css?v=28">

  <script>
    try {
      var t = localStorage.getItem("trashbelt-tema");
      document.documentElement.dataset.theme = (t === "light") ? "light" : "dark";
    } catch (e) {
      document.documentElement.dataset.theme = "dark";
    }
  </script>
</head>
<body>
  <div class="main">
    <div class="page-header">
      <h1>Histórico de coletas</h1>
      <p>Clique nos títulos das colunas para ordenar</p>
    </div>

    <div class="history-controls">
      <select class="filter-select" id="filtro-material" onchange="filtrarHistorico(this.value)">
        <option value="todos">Material: Todos</option>
        <option value="papel">Material: Papel</option>
        <option value="plastico">Material: Plástico</option>
        <option value="vidro">Material: Vidro</option>
      </select>
      <span class="history-count" id="historico-contador">Carregando…</span>
    </div>

    <div class="panel table-wrap">
      <table>
        <thead>
          <tr>
            <th data-key="data" onclick="ordenar('data')" title="Ordenar por data">Data</th>
            <th data-key="horario" onclick="ordenar('horario')" title="Ordenar por horário">Horário</th>
            <th data-key="material" onclick="ordenar('material')" title="Ordenar por material">Material</th>
            <th data-key="quantidadeUn" onclick="ordenar('quantidadeUn')" title="Ordenar por quantidade">Quantidade</th>
            <th data-key="status" onclick="ordenar('status')" title="Ordenar por status">Status</th>
          </tr>
        </thead>
        <tbody id="tbody-historico">
          <tr>
            <td colspan="5" class="empty-state">
              <p>Nenhum registro disponível. Aguardando dados da esteira.</p>
            </td>
          </tr>
        </tbody>
      </table>
    </div>
  </div>

  <footer class="site-footer">
    TRASHBELT • 2026 — Monitoramento de resíduos
  </footer>

  <!-- Sprite SVG -->
  <svg xmlns="http://www.w3.org/2000/svg" style="display:none" aria-hidden="true">
    <defs>
      <symbol id="i-papel" viewBox="0 0 24 24"><path d="M14 2H6a2 2 0 0 0-2 2v16a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2V8z"/><polyline points="14 2 14 8 20 8"/><line x1="16" y1="13" x2="8" y2="13"/><line x1="16" y1="17" x2="8" y2="17"/></symbol>
      <symbol id="i-plastico" viewBox="0 0 24 24"><path d="M10 2.5h4"/><path d="M10.5 2.5v3.2L8.5 9v11a1.8 1.8 0 0 0 1.8 1.8h3.4a1.8 1.8 0 0 0 1.8-1.8V9l-2-3.3V2.5"/><path d="M8.5 12.5h7"/></symbol>
      <symbol id="i-vidro" viewBox="0 0 24 24"><path d="M7 3h10l-1.2 8.2a3.9 3.9 0 0 1-7.6 0z"/><path d="M12 15.2V21"/><path d="M8.5 21h7"/></symbol>
      <symbol id="i-sol" viewBox="0 0 24 24"><circle cx="12" cy="12" r="4"/><path d="M12 2v2"/><path d="M12 20v2"/><path d="M4.93 4.93l1.41 1.41"/><path d="M17.66 17.66l1.41 1.41"/><path d="M2 12h2"/><path d="M20 12h2"/><path d="M4.93 19.07l1.41-1.41"/><path d="M17.66 6.34l1.41-1.41"/></symbol>
      <symbol id="i-lua" viewBox="0 0 24 24"><path d="M21 12.79A9 9 0 1 1 11.21 3 7 7 0 0 0 21 12.79z"/></symbol>
    </defs>
  </svg>

  <script src="../js/shell.js?v=28"></script>
  <script src="../js/app.js?v=28"></script>
</body>
</html>
